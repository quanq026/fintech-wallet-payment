plugins {
    id 'java-library'
    id 'com.google.protobuf'
}
dependencies {
    api 'com.google.protobuf:protobuf-java:4.32.1'
    api 'io.grpc:grpc-protobuf:1.75.0'
    api 'io.grpc:grpc-stub:1.75.0'
    api 'io.grpc:grpc-netty-shaded:1.75.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.32.1' }
    plugins { grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.75.0' } }
    generateProtoTasks { all().configureEach { plugins { grpc {} } } }
}


group = 'ra.fintech'
version = '1.0.0'
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }

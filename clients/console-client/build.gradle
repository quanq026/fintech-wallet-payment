plugins { id 'application' }
dependencies {
    implementation project(':common')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'ra.consoleclient.presentation.WalletConsole' }
application { applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'] }
run { standardInput = System.in }



group = 'ra.fintech'
version = '1.0.0'
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }

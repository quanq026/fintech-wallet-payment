server.port=8083
server.address=127.0.0.1
spring.jackson.deserialization.accept-float-as-int=false
spring.application.name=payment-service
spring.datasource.url=${PAYMENT_DB_URL:jdbc:mysql://127.0.0.1:3306/fintech_payment}
spring.datasource.username=${PAYMENT_DB_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
internal.token=${INTERNAL_TOKEN}
bank.secret=${BANK_SECRET}
bank.url=${BANK_URL:http://127.0.0.1:8086}
engine.url=${ENGINE_URL:http://127.0.0.1:8082}
management.endpoints.web.exposure.include=health

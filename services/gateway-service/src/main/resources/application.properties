server.port=${GATEWAY_PORT:8080}
server.address=127.0.0.1
spring.application.name=gateway-service
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
clients.alice=${ALICE_HMAC_KEY}
clients.bob=${BOB_HMAC_KEY}
clients.admin=${ADMIN_HMAC_KEY}
internal.token=${INTERNAL_TOKEN}
services.engine=${ENGINE_URL:http://127.0.0.1:8082}
services.payment=${PAYMENT_URL:http://127.0.0.1:8083}
services.audit=${AUDIT_URL:http://127.0.0.1:8084}
management.endpoints.web.exposure.include=health
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

server.port=8084
server.address=127.0.0.1
spring.application.name=audit-service
spring.datasource.url=${AUDIT_DB_URL:jdbc:mysql://127.0.0.1:3306/fintech_audit}
spring.datasource.username=${AUDIT_DB_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:127.0.0.1:9092}
spring.kafka.consumer.group-id=fintech-audit
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1
internal.token=${INTERNAL_TOKEN}
management.endpoints.web.exposure.include=health

server.port=8082
server.address=127.0.0.1
spring.jackson.deserialization.accept-float-as-int=false
spring.application.name=transaction-service
spring.datasource.url=${ENGINE_DB_URL:jdbc:mysql://127.0.0.1:3306/fintech_engine}
spring.datasource.username=${ENGINE_DB_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:127.0.0.1:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
internal.token=${INTERNAL_TOKEN}
ledger.host=${LEDGER_HOST:127.0.0.1}
ledger.port=${LEDGER_GRPC_PORT:9091}
fraud.url=${FRAUD_URL:http://127.0.0.1:8085}
management.endpoints.web.exposure.include=health
